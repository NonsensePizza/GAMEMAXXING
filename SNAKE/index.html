<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>🐍 Snake</h1>

    <p>Use the arrow keys to move!</p>

    <canvas id="game" width="400" height="400"></canvas>

    <p>
        Score: <span id="score">0</span>
    </p>

    <p class="mobile-hint">
        📱 Swipe or use the buttons to move!
    </p>


    <!-- ==========================
         MOBILE CONTROLS
    ========================== -->

    <div class="mobile-controls">

        <button class="control-button up-button" data-direction="UP">
            ▲
        </button>

        <div class="horizontal-controls">

            <button class="control-button" data-direction="LEFT">
                ◀
            </button>

            <button class="control-button" data-direction="DOWN">
                ▼
            </button>

            <button class="control-button" data-direction="RIGHT">
                ▶
            </button>

        </div>

    </div>


    <button id="startButton">
        Start Game
    </button>

    <button id="restartButton" style="display: none;">
        Restart Game
    </button>

    <script src="script.js"></script>

</body>

</html>
